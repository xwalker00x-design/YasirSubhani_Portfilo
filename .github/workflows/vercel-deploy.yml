name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets live in the VERCEL_TOKEN environment (not repository secrets).
    # All three names must exist in that one environment — see repo Settings → Environments.
    environment: VERCEL_TOKEN
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Vercel secrets
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets in GitHub environment 'VERCEL_TOKEN': ${missing[*]}"
            echo "Add all three at: Settings → Environments → VERCEL_TOKEN → Environment secrets"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (CI)
        run: npm ci

      - name: Build (optional for frameworks that need prebuild)
        run: |
          if [ -f package.json ] && cat package.json | jq -e '.scripts.build' >/dev/null; then
            npm run build
          else
            echo "No build script found; continuing"
          fi

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build on Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"


