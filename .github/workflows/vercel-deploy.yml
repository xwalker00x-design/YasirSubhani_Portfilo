name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load VERCEL_TOKEN
        environment: VERCEL_TOKEN
        run: echo "VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}" >> "$GITHUB_ENV"

      - name: Load VERCEL_ORG_ID
        environment: VERCEL_ORG_ID
        run: echo "VERCEL_ORG_ID=${{ secrets.VERCEL_ORG_ID }}" >> "$GITHUB_ENV"

      - name: Load VERCEL_PROJECT_ID
        environment: VERCEL_PROJECT_ID
        run: echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID }}" >> "$GITHUB_ENV"

      - name: Validate Vercel secrets
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing: ${missing[*]}"
            echo "Each name must exist as a secret in its matching GitHub environment."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (CI)
        run: npm ci

      - name: Build (optional for frameworks that need prebuild)
        run: |
          if [ -f package.json ] && cat package.json | jq -e '.scripts.build' >/dev/null; then
            npm run build
          else
            echo "No build script found; continuing"
          fi

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build on Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
