name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# New push cancels an in-flight deploy so only the latest commit is deployed.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VERCEL_TOKEN
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Vercel secrets
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets in environment 'VERCEL_TOKEN': ${missing[*]}"
            exit 1
          fi

      - name: Deploy to Vercel (build on Vercel — faster CI)
        run: npx vercel@41 deploy --prod --yes --token="$VERCEL_TOKEN"
